version: '3.8'
services:
  contract_service:
    image: contract-processor:latest
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - CACHE_HOST=redis
      - LOG_LEVEL=info

  postgres:
    image: postgres:14
    environment:
      - POSTGRES_DB=contracts_db
      - POSTGRES_USER=app_user
